name: ParentalControlJobs

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: gradle wrapper
        run: gradle wrapper
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: 16.3
      - name: Build with Gradle
        run: ./gradlew assembleXCFramework
      - name: Install Mint
        run: brew install mint
      - name: Cache Mint modules
        id: cache-mint
        uses: actions/cache@v4
        env:
          cache-name: cache-mint-modules
        with:
          path: ~/.mint
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - if: ${{ steps.cache-mint.outputs.cache-hit != 'true' }}
        name: List the state of Mint modules
        continue-on-error: true
        run: mint list
      - name: Generate Xcode project
        run: mint bootstrap && mint run xcodegen
      - name: Build and test macOS
        run: xcodebuild test -project ParentalControl.xcodeproj -scheme ParentalControlAppMacOS -destination "platform=macOS" -skipMacroValidation
